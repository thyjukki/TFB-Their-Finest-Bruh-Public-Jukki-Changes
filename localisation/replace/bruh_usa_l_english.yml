  USA_john_garner:0 "John Garner"
  USA_john_garner_desc:0 "John Nance Garner has played an unusually large role as Vice President, helping Roosevelt maneuver legislation through Congress. While he supports the administration, he does not agree one-to-one with every part of the President's New Deal program."
