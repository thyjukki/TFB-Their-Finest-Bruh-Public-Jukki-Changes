  usa.1006.t:0 "You have Joined the Allies"
  usa.1006.d:0 "You are in the allies now because either Germany, Italy, or Japan has gone to war with the UK, France, Poland, or the Czechs.\n\nThis is so the USA can watch whats going on, but they won't be able to join any wars still."
  usa.1006.a:0 "Okay"
  usa.1011.t:0 "Award Fighter Contract"
  usa.1011.d:0 "The Air Corps has opened bids for a new fighter contract. North American offers range and production discipline, Republic Aviations promises agile fighter development, and Curtiss-Wright argues that its broader light aircraft experience can deliver the next leap forward. Which manufacturer should receive the contract?"
  usa.1011.a:0 "North American Aviation"
  usa.1011.b:0 "Republic Aviations"
  usa.1011.c:0 "Curtiss-Wright"
  usa.1012.t:0 "Award Escort Fighter Contract"
  usa.1012.d:0 "The need for long-range escort fighters has narrowed the field to firms with experience in extended-range and heavier fighter designs. North American and Lockheed have both submitted serious proposals. Which manufacturer should receive the contract?"
  usa.1012.a:0 "North American Aviation"
  usa.1012.b:0 "Lockheed"
  usa.1013.t:0 "Award CAS Contract"
  usa.1013.d:0 "The Air Corps has opened bids for a dedicated close air support contract. North American, Douglas, and Curtiss-Wright have each proposed aircraft suited for direct battlefield support. Which manufacturer should receive the contract?"
  usa.1013.a:0 "North American Aviation"
  usa.1013.b:0 "Douglas Aircraft Company"
  usa.1013.c:0 "Curtiss-Wright"
  usa.1014.t:0 "Award Tactical Bomber Contract"
  usa.1014.d:0 "A new tactical bomber contract requires a manufacturer capable of balancing range, payload, and reliability. North American and Lockheed have submitted the strongest bids. Which manufacturer should receive the contract?"
  usa.1014.a:0 "North American Aviation"
  usa.1014.b:0 "Lockheed"
  usa.1015.t:0 "Award Naval Aircraft Contract"
  usa.1015.d:0 "Naval aviation requires aircraft that can work with the fleet and strike targets at sea. Grumman, North American, and Curtiss-Wright have all put forward proposals. Which manufacturer should receive the contract?"
  usa.1015.a:0 "Grumman"
  usa.1015.b:0 "North American Aviation"
  usa.1015.c:0 "Curtiss-Wright"
  usa.1007.t:0 "You can Join the War"
  usa.1007.d:0 "You are in the allies and can now join the war.\n\nYou should probably do that."
  usa.1007.a:0 "Okay"
  usa.1008.t:0 "FDR Announces Running for Second Term"
  usa.1008.d:0 "President Roosevelt has announced that he will seek a second term, a decision widely expected by both his supporters and his opponents. In his remarks, Roosevelt vowed to continue the New Deal policies that have defined his administration and promised that the federal government would not abandon the work of recovery.\n\nVice President John Nance Garner has been instrumental in the political games needed to push those policies through Congress, even when he has not fully supported every point of the President's program. His connections remain powerful, but some advisers now ask whether Roosevelt would be better served by a more politically aligned running mate.\n\nHenry A. Wallace has been one of the New Deal's strongest supporters. His earlier Republican ties could also help broaden the ticket. Should Roosevelt keep Garner, or turn to Wallace?"
  usa.1008.a:0 "Garner, his connections are irreplaceable"
  usa.1008.b:0 "Henry A. Wallace, Strong new deal supporter"
  USA_garner_congress_campaign_focus_delay_tt:0 "§YJudicial Procedures Reform Bill§! will take twice as long to complete."
  usa.1009.t:0 "The Court Packing Bill Stalls"
  usa.1009.d:0 "The attempt to pass the Judicial Procedures Reform Bill has been blocked by some of the more conservative Democrats in Congress. Vice President Garner's connections have not been enough to bring them fully in line, and the administration now faces a bruising fight inside its own party.\n\nStill, the threat of court packing has already had an effect. A crucial justice has shifted his view, allowing the necessary New Deal provisions to pass the Supreme Court by a narrow 5-4 decision. The question now is whether to keep forcing the bill through Congress, or accept the victory already won."
  usa.1009.a:0 "Push the bill through"
  usa.1009.b:0 "Concede the fight"
  usa.1010.t:0 "Conservative Democrats Resist"
  usa.1010.d:0 "The Judicial Procedures Reform Bill remains stuck behind a handful of conservative Democrats. Without Garner as the administration's bridge to that wing of the party, the White House must decide whether to bargain for the votes or force the issue directly.\n\nThe courts have already felt the pressure, but the bill could still define the pace and shape of the next stage of recovery."
  usa.1010.a:0 "Make concessions to get the bill passed"
  usa.1010.b:0 "Push the bill through"
  USA_great_depression_cooldown_245_tt:0 "After this law is passed, it will take §Y245 days§! until further New Deal legislation is drafted and ready to be signed."


  usa.70.t:0 "Flint Strikes"
  usa.70.desc:0 "The 1936–1937 Flint sit-down strike, also known as the General Motors sit-down strike, the great GM sit-down strike, and so on, was a sitdown strike at the General Motors plant in Flint, Michigan, United States."
  usa_flint_strikes.1.a:0 "Deal with the Flint Strikes"

