l_english:

  #### FOCUSES ####
  USA_new_deal_2:0 "Second New Deal"
  USA_new_deal_2_desc:0 "Although the economy has begun to rise since the tragedy of 1929, there is more work to be done. Millions remain unemployed, and radicals have begun to criticize FDR for not going far enough. His answer to this was the Second New Deal, a bundle of policies aimed specifically at alleviating the damages done by the Depression."
  USA_construction_1:0 "Fight the Monopolies"
  USA_construction_1_desc:0 "Large corporations have long held monopolistic control over America's vast natural resources. By breaking their grip, ensure more competition and protection of smaller businesses."
  USA_electrification_effort:0 "Electrification Effort"
  USA_electrification_effort_desc:0 "Vast stretches of rural America remain without access to electricity. We should invest in more electricity generation and distribution to bring the benefits of modern technology to the countryside."
  USA_rural_electrification_idea:0 "Rural Electrification"
  USA_rural_electrification_idea_desc:0 "The Tennessee Valley Authority's dam projects have brought reliable electricity to rural communities, reducing dependence on coal and modernizing the American heartland."
  USA_construction_2:0 "National Labour Relations Act"
  USA_construction_2_desc:0 "The NLRA, also known as the Wagner Act, is the foundation of American labor law and fully legalizes trade unions under the principle of collective bargaining. Aimed at bestowing power to workers in the fact of abject poverty, company unions and unfair labor practices are banned under this law."
  USA_construction_3:0 "Rural Electrification"
  USA_construction_3_desc:0 "Though we are and always have been a modern nation, large portions of the countryside lack basic utilities such as electricity and running water. The Rural Electrification Act aims to rectify this issue by installing electrical distribution systems throughout isolated rural areas."
  USA_construction_4:0 "Natural Resource Development"
  USA_construction_4_desc:0 "Though rich in natural resources, the economic crisis has left mineral extraction as a secondary concern. This is simply the incorrect approach. Economic revitalization requires employment and stimulus, both of which mineral extraction provides."
  USA_extend_civilian_conservation_corps:0 "Extend federal work programs"
  USA_extend_civilian_conservation_corps_desc:0 "The Civilian Conservation, WPA and other federal work programs have been a great success in providing employment and infrastructure to the nation. We should extend these programs to continue their benefits."
  USA_extend_civilian_conservation_corps_tt:0 "Unlocks a second set of §YProspect for Resources§! decisions after the normal development cap. These decisions cost §Y10§! Political Power and use §Y6§! Civilian Factories."
  USA_divert_ccc_funding_to_private_companies:0 "Cut down Federal Work Programs"
  USA_divert_ccc_funding_to_private_companies_desc:0 "Federal work programs had their uses, but economy is now on the rise and we can now divert funding to private companies to help them grow and create jobs."
  USA_repurpose_ccc:0 "Repurpose work programs for military"
  USA_repurpose_ccc_desc:0 "The federal work programs have built roads, camps, and infrastructure across the country. Those same skills can be redirected toward military training camps and supporting infrastructure for a nation that may soon need to mobilize."
  USA_repurposed_ccc_idea:0 "Repurposed Work Programs"
  USA_repurposed_ccc_idea_desc:0 "Federal work programs are being redirected toward military training camps and supporting infrastructure."
  USA_develop_arkansas_aluminium_deposits_ccc:0 "Use Corps to Expand Arkansas Aluminium Deposits"
  USA_develop_new_york_aluminium_deposits_ccc:0 "Use Corps to Expand New York Aluminium Deposits"
  USA_develop_tennessee_aluminium_deposits_ccc:0 "Use Corps to Expand Tennessee Aluminium Deposits"
  USA_develop_washington_aluminium_deposits_ccc:0 "Use Corps to Expand Washington Aluminium Deposits"
  USA_develop_idaho_tungsten_deposits_ccc:0 "Use Corps to Expand Idaho Tungsten Deposits"
  USA_develop_california_tungsten_deposits_ccc:0 "Use Corps to Expand California Tungsten Deposits"
  USA_develop_minnesota_steel_deposits_ccc:0 "Use Corps to Expand Minnesota Steel Deposits"
  USA_develop_pennsylvania_steel_deposits_ccc:0 "Use Corps to Expand Pennsylvania Steel Deposits"
  USA_develop_ohio_steel_deposits_ccc:0 "Use Corps to Expand Ohio Steel Deposits"
  USA_develop_indiana_steel_deposits_ccc:0 "Use Corps to Expand Indiana Steel Deposits"
  USA_develop_montana_chromium_deposits_ccc:0 "Use Corps to Expand Montana Chromium Deposits"
  USA_develop_california_chromium_deposits_ccc:0 "Use Corps to Expand California Chromium Deposits"
  USA_develop_oregon_chromium_deposits_ccc:0 "Use Corps to Expand Oregon Chromium Deposits"
  USA_develop_alaska_chromium_deposits_ccc:0 "Use Corps to Expand Alaska Chromium Deposits"
  USA_recession_recovery:0 "Recession Recovery"
  USA_recession_recovery_desc:0 "Fiscal policy changes and political turmoil can create uncertainty in the markets. We should invest in our industries to ease the burden and restore confidence in the American economy."
  USA_construction_7:0 "Civilian Conservation Corps"
  USA_construction_7_desc:0 "When the Great Depression hit it hit younger single men hard as they now compete for the runt of the litter of jobs, with government oversight we can get these people working and bringing back america to work."
  USA_balance_the_budget:0 "Balance the Budget"
  USA_balance_the_budget_desc:0 "The treasury has been in a spin ever since the Great Depression hit, if we can balance the books we can create a more stable ground for longer term growth."
  USA_deficit_spending:0 "Deficit Spending"
  USA_deficit_spending_desc:0 "With the standing support from new deal democrats, the possibility to keep deficit spending practices is still possible. The American economy at its core is strong and therefore we are very capable of growing our selfs out of any future deficits."
  USA_build_up_west_pacific:0 "Fortify the West Pacific"
  USA_build_up_west_pacific_desc:0 "To make our presence felt for the Japanese setting up forward operating bases in Guam and Wake might just have them taking 2nd thoughts."
  USA_build_up_central_pacific:0 "Fortify the Central Pacific"
  USA_build_up_central_pacific_desc:0 "In any future conflict with Japan and with the advent of carriers having bases close but far enough away from Japan should be vital in containing them if they should choose to strike."
  USA_mechanized_landing_forces:0 "Mechanized Landing Forces"
  USA_mechanized_landing_forces_desc:0 "Landing craft and amphibious armor must be produced in numbers large enough to carry the Marine Corps across defended beaches. Standardized designs and dedicated production can make these vehicles cheaper to field."
  USA_war_production_board:0 "War Production Board"
  USA_war_production_board_desc:0 "By merging the Supply Priorities and Allocations Board and the Office of Production Management into a single agency we can better optimize the usage of our materials."

  USA_flint_strikes:0 "Flint Strikes"
  USA_flint_strikes_desc:0 "Workers of General Motors have now taken to sitting down and refusing to work in relation to cuts in pay, furthermore the unions have all combined to form the UAW which now march to unionize domestic automobile industries."
  USA_side_with_big_business:0 "Side with the Big Business"
  USA_side_with_big_business_desc:0 "We can't get the economy driving if we cave into every demand, side with business and assure them they have the governments support."
  USA_side_with_workers_union:0 "Side with the Workers Union"
  USA_side_with_workers_union_desc:0 "The Workers of these firms have gotten the rotten end of the stick in the best of times and its time the government stepped up and back these unions."
  USA_sit_down_strikes:0 "Sit Down Strikes"
  USA_sit_down_strikes_desc:0 "The strikes will now slowly be phased out now we have reached a deal and reaffirmed our position."
  USA_rebuilding_the_nation:0 "Rebuilding the Nation"
  USA_rebuilding_the_nation_desc:0 "Tossed into ruin, we will rebuild this nation brick by brick, house by house."


  USA_landon_deal:0 "Landon's Deal"
  USA_landon_deal_desc:0 "One of the New Deal's most influential supporters is, ironically enough, Alf Landon himself. Criticizing some portions of the policies, he also supported many more instances of New Deal legislation. Landon's Deal will bring out what the New Deal is meant to be, without any of the dangerous radicalism Roosevelt included."

  USA_peace_of_our_time:0 "Neutrality is the way"
  USA_peace_of_our_time_desc:0 "It always seemed the issues and squabbles and concerns of nations thousands of miles away should be just that, thousands of miles away."
  USA_prepare_our_defenses:0 "Prepare Our Defenses"
  USA_prepare_our_defenses_desc:0 "To deter Germany from bringing the war to our lands, we must ensure that our defenses are prepared before the conflict can cross the Atlantic."
  USA_prepare_our_defenses_idea:0 "Prepared Defenses"
  USA_prepare_our_defenses_idea_desc:0 "The threat of war reaching American shores has driven a renewed effort to prepare our military industry for national defense."
  USA_us_cavalry:0 "U.S Cavalry"
  USA_us_cavalry_desc:0 "The U.S. Cavalry remains a disciplined and mobile arm of the army, carrying forward traditions of scouting, rapid movement, and flexible field operations."
  USA_us_cavalry_rough_riders:0 "U.S Cavalry"
  USA_us_cavalry_rough_riders_desc:0 "The U.S. Cavalry draws on the legacy of the Rough Riders, carrying forward a tradition of aggressive scouting, mobility, and hard fighting."
  USA_us_cavalry_armored:0 "U.S Cavalry"
  USA_us_cavalry_armored_desc:0 "The U.S. Cavalry has begun adapting its traditions of mobility and flexible field operations to motorized and mechanized formations."
  USA_us_cavalry_armored_rough_riders:0 "U.S Cavalry"
  USA_us_cavalry_armored_rough_riders_desc:0 "The U.S. Cavalry draws on the legacy of the Rough Riders while adapting its traditions of mobility and flexible field operations to motorized and mechanized formations."
  USA_cavalry_traditions:0 "Cavalry Traditions"
  USA_cavalry_traditions_desc:0 "The horse remains good old reliable. Even in an age of engines and steel, cavalry traditions still offer mobility, discipline, and proven methods our army should not discard lightly."
  USA_armored_developments:0 "Armored Developments"
  USA_armored_developments_desc:0 "It is time to abolish old thinking and study how European armies are using armor to reshape the battlefield. The future belongs to speed, firepower, and armored formations."
  USA_armored_cavalry:0 "Armored Cavalry"
  USA_armored_cavalry_desc:0 "By combining the mobility traditions of cavalry with modern armored vehicles, we can create formations suited for rapid movement and flexible battlefield response."
  USA_mounted_infantry:0 "Mounted Infantry"
  USA_mounted_infantry_desc:0 "U.S. Cavalry is more mounted infantry than the typical image of sword-wielding cavalry charges. Its strength lies in mobility, discipline, and dismounted firepower rather than romantic notions of the old cavalry arm."
  USA_terrain_advantage:0 "Terrain Advantage"
  USA_terrain_advantage_desc:0 "Cavalry units trained to exploit difficult ground can move quickly through dificult terrain, where armored units would struggle."
  USA_terrain_advantage_tt:0 "§YCavalry§!:\n  §YForest§!:\n    Attack: §G+5.00%§!\n    Movement: §G+5.00%§!\n  §YJungle§!:\n    Attack: §G+5.00%§!\n    Movement: §G+5.00%§!\n  §YRiver§!:\n    Attack: §G+5.00%§!\n    Movement: §G+5.00%§!"
  USA_rough_riders_legacy:0 "Rough Riders Legacy"
  USA_rough_riders_legacy_desc:0 "The charge up San Juan Hill left a legend larger than any one regiment. By embracing the Rough Riders' aggressive spirit, our cavalry arm can become a sharper and more confident battlefield force."
  USA_armored_car_integration:0 "Armored Car Integration"
  USA_armored_car_integration_desc:0 "National Defense Act of 1920 stipulates that tanks belong to infantry, but by defining light tanks as armored cars, we can still give our cavalry formations the armored vehicles they need to keep up with modern warfare."
  USA_armored_division:0 "Armored Division"
  USA_armored_division_desc:0 "Independent armored divisions will allow tanks to operate as the decisive arm of breakthrough and exploitation, rather than as scattered support for infantry formations."
  USA_infantry_tanks:0 "Infantry Tanks"
  USA_infantry_tanks_desc:0 "Tanks belong to infantry branch and should support the infantry directly, giving advancing troops mobile firepower and protection against enemy strongpoints."
  USA_detroit_arsenal:0 "Detroit Arsenal"
  USA_detroit_arsenal_desc:0 "Detroit's automotive industry gives us the industrial base needed to build modern armored vehicles at scale. We should formalize this capacity into a true arsenal of tank production."
  USA_congress_isolation_campaign:0 "Conservative Manifesto"
  USA_congress_isolation_campaign_desc:0 "By drafting a clear plan and securing support from conservative Democrats, we can make passing the points of our manifesto through Congress far easier."
  USA_lean_on_america_first_support:0 "Lean on America First Support"
  USA_lean_on_america_first_support_desc:0 "The America First movement commands a powerful isolationist base. Leaning on their support will strengthen our hand in Congress, though it will make calls for intervention harder to sustain."

  USA_balance_the_budget2:0 "Balance the Budget"
  USA_balance_the_budget2_desc:0 "The key and first step to unlocking a growing economy is balanced budget from there the moon seems not so far."
  USA_invest_in_small_businesses:0 "Invest in Small Businesses"
  USA_invest_in_small_businesses_desc:0 "Investing into the smaller businesses is like investing into the heart and soul of america, the creativity, ingenuity, can come from a donation from far away."
  USA_pension_reform:0 "Pension Reforms"
  USA_pension_reform_desc:0 "To ensure security in work is to also require security when you can't work, pension reform has always been the agenda of USA."
  USA_economic_assistance:0 "Economic Assistance"
  USA_economic_assistance_desc:0 "Our neutrality laws prevent us from sending arms or war material to the belligerents, but they say nothing about economic investment. With Britain fighting for her life, we can provide financial backing to help construct new industrial capacity on British soil — keeping their factories running and their economy afloat without firing a single shot ourselves."
  USA_shipyard_rebuild:0 "USA Shipbuilding Revival"
  USA_shipyard_rebuild_desc:0 "To Supplement the domestic economy of USA will also require the ships to carry our goods across the world."
  USA_infrastructure_investment:0 "Infrastructure Investment"
  USA_infrastructure_investment_desc:0 "With the booming car industry comes the demand for an ever expansive infrastructure network, it also does not hurt that it soaks up unemployment."
  USA_economic_boom:0 "Economic Boom"
  USA_economic_boom_desc:0 "With fiscal restraint, infrastructure investment, and market confidence aligned, the economy is entering a period of rapid expansion."
  USA_economic_boom_idea:0 "Economic Boom"
  USA_economic_boom_idea_desc:0 "A surge of private confidence and public investment has created a temporary boom across the American economy."
  USA_federal_housing_act2:0 "Federal Housing Act"
  USA_federal_housing_act2_desc:0 "A new subsidized housing initiative will go a long way into reducing poverty and homelessness"

  USA_labour_management:0 "Labour-Management Relations Act"
  USA_labour_management_desc:0 "Labor unions wield unprecedented power in the workforce, though clearly not for the better. We must limit the unfair labor practices of unions and ensure the balance of power and order in corporate society."
  USA_business_ties:0 "Business Ties"
  USA_business_ties_desc:0 "Among Landon's chief supporters are large businesses, believing that FDR's policies were far too union-favored. Landon's election means prosperity for corporations, and we cannot let them forget that."
  USA_standard_oil:0 "Standard Oil of California"
  USA_standard_oil_desc:0 "Rarely does one see an oil baron as president, but that is exactly what has occurred. We cannot let this opportunity go to waste, for influence is useful, regardless of how it may be attained."
  USA_gold_standard:0 "Reaffirm the Gold Standard"
  USA_gold_standard_desc:0 "Fiat currency is far too volatile during recession. It is the duty of the government to regulate currency to the greatest efficacy plausible, and we have deemed it necessary for a stable backing of the dollar to be reinstated."
  USA_tackle_waste:0 "War on Waste"
  USA_tackle_waste_desc:0 "In times of trouble, the populace must be conscious of all usage, no matter how small. The American people are industrious, it should be no trouble to reduce waste in the short-term."
  USA_denounce_neutrality:0 "Denounce Neutrality"
  USA_denounce_neutrality_desc:0 "The United States of America has always stood as the defender of liberty, regardless of borders or affiliation. We cannot discard this notion simply because of a recession. The American people will fight on!"
  USA_foreign_service_volunteers:0 "Foreign Service Volunteers"
  USA_foreign_service_volunteers_desc:0 "It is illegal for US citizens to join foreign armed forces, with punishment being the loss of one's citizenship. Still, many have volunteered. By turning a blind eye while keeping contact with these individuals, we could learn valuable intelligence and military experience."
  USA_foreign_service_volunteers_decisions:0 "Foreign Service Volunteers"
  USA_foreign_service_volunteers_decisions_desc:0 "Though American citizens are forbidden from joining foreign armed forces, many are willing to volunteer in wars abroad. By quietly turning a blind eye and maintaining informal contacts, we can learn from their experiences without openly abandoning neutrality."
  USA_lincoln_brigade:0 "Lincoln Brigade"
  USA_lincoln_brigade_desc:0 "American volunteers have already crossed the Atlantic to fight for the Spanish Republic. Their communist symphaties are concerning, but their commitment can still aid the anti-fascist cause."
  USA_flying_tigers:0 "Flying Tigers"
  USA_flying_tigers_desc:0 "American pilots willing to fly for China can bring experience, confidence, and a much-needed reserve of trained manpower to the struggle against Japan."
  USA_eagle_squadron:0 "Eagle Squadron"
  USA_eagle_squadron_desc:0 "Some American pilots are willing to fight for Britain and France before our nation is ready to join the war. We can quietly allow these efforts to develop."
  USA_canadian_american_volunteers:0 "Canadian-American Volunteers"
  USA_canadian_american_volunteers_desc:0 "Canada offers a route for Americans who believe the fight overseas is already their fight. Their service can strengthen the Commonwealth war effort."
  USA_finnish_american_legion:0 "Finnish American Legion"
  USA_finnish_american_legion_desc:0 "Finnish Americans are willing to aid Finland in its war against bolshevism. Their experience in the harsh conditions of the Winter War can be invaluable to our own forces if we are to fight in similar conditions."
  USA_sweenys_french_detachment:0 "Sweeny's French Detachment"
  USA_sweenys_french_detachment_desc:0 "Charles Sweeny and like-minded American air menvolunteers have sought service within French airforce. Their quiet support can help France keep fighting."
  USA_the_five_yanks:0 "The Five Yanks"
  USA_the_five_yanks_desc:0 "A group of 5 american volunteers who were among the first amercan personel to fight axis on the ground. They are a big propaganda boost for the allies showing transatlantic solidarity and the willingness of americans to fight for the cause of freedom."
  USA_tax_reform:0 "Tax Reform"
  USA_tax_reform_desc:0 "The income tax has been a disaster in the long run, and has far outlived its purpose. Siphoning much-needed revenue from household families is simply immoral. By reinstituting certain tariffs and excise taxes, we can lower the tax rates on individuals."
  USA_the_sherman:0 "The Sherman"
  USA_the_sherman_desc:0 "The M4 Sherman has proven itself to be a very capable and versatile vehicle. Our production efforts should be focused on improving the quality and quantity of it's manufacturing process."
  USA_hello_to_ford:0 "Say Hello to Ford..."
  USA_hello_to_ford_desc:0 "The American automotive industry was by far the largest in world. We should use this massive car making industry to outfit our troops with modern fighting vehicles and transports."
  USA_motorized_artillery:0 "Motorized Artillery"
  USA_motorized_artillery_desc:0 "Rocket artillery mounted on motorized platforms can keep pace with mobile formations while delivering devastating fire support."
  USA_self_propelled_guns:0 "Self-Propelled Guns"
  USA_self_propelled_guns_desc:0 "Mounting artillery and anti-aircraft weapons on armored chassis will give our mobile formations the fire support they need without sacrificing protection or speed."
  USA_self_propelled_guns_idea:0 "Self-Propelled Guns"
  USA_self_propelled_guns_idea_desc:0 "Standardized armored chassis and improved production methods make self-propelled artillery and anti-aircraft vehicles easier to manufacture."
  USA_douglas_c47:0 "Douglas C-47"
  USA_douglas_c47_desc:0 "The C-47 differed from the civilian DC-3 in numerous modifications, including being fitted with a cargo door, hoist attachment, and strengthened floor, along with a shortened tail cone for glider-towing shackles, and an astrodome in the cabin roof."
  USA_race_for_rubber:0 "Race for Rubber"
  USA_race_for_rubber_desc:0 "Production of synthetic rubber in the United States expanded greatly during World War II since the Axis powers controlled nearly all the world's limited supplies of natural rubber by mid-1942. By 1944, a total of 50 factories were manufacturing it, pouring out a volume of the material twice that of the world's natural rubber production before the beginning of the war."
  USA_victory_plan:0 "Implement The Victory Plan"
  USA_victory_plan_desc:0 "In 1941, a team of officers led by General Albert Wedemeyer on behalf of General George C. Marshall drew up the Victory Program, whose premise was that the Soviet Union would be defeated that year, and that to defeat Nazi Germany would require the United States to raise by the summer of 1943 a force of 215 divisions comprising 8.7 million men."
  USA_cash_and_carry_program:0 "Cash & Carry Program"
  USA_cash_and_carry_program_desc:0 "With Britain at war against Germany, American industry can support friendly powers without committing the nation directly. Under a cash and carry system, foreign buyers will pay up front and transport the goods themselves."
  USA_revitilize_military_industry:0 "Revitilize Military Industry"
  USA_revitilize_military_industry_desc:0 "The war has created new demand for American arms and equipment, turning idle capacity and private investment toward a military industrial boom."
  USA_push_over_the_planes:0 "Push Over The Planes"
  USA_push_over_the_planes_desc:0 "The Lend-Lease Act forbids aircraft from taking off and flying directly to a belligerent country. By building up airstrips near the Canadian border, however, we can deliver the planes to the edge of legality and have them pushed across."
  USA_home_front_defense:0 "Home Front Defense"
  USA_home_front_defense_desc:0 "Foreign wars may rage across the oceans, but our first duty is to ensure the security, stability, and readiness of the American homeland."
  USA_home_front_defense_idea:0 "Home Front Defense"
  USA_home_front_defense_idea_desc:0 "America has turned its industrial planning inward, prioritizing the factories and defenses needed to protect the homeland."
  USA_home_front_defense_lend_lease_warning_tt:0 "§RWarning:§! Completing this focus will prevent you from using §YLend Lease§! until you have completed §YWartime Industry§!."
  USA_public_projects_subsidies_warning_tt:0 "§RWarning:§! Completing this focus means your allies will not have access to §YEquipment Purchase Subsidies§!."
  USA_arsenal_of_democracy_subsidies_tt:0 "Unlocks §YEquipment Purchase Subsidies§! for your allies when they are at war."
  USA_push_over_the_planes_border_airbases_tt:0 "Adds §Y1 Air Base§! in §YMontana§!.\n§YAircraft Purchases§! from the §YUSA§! gain §G500§! extra subsidies for every airbase level in §YMontana§!, §YNorth Dakota§!, and §YMinnesota§!."
  USA_congress_campaign:0 "Combat Congressional Isolationism"
  USA_congress_campaign_desc:0 "We must combat congressional isolationism."
  USA_judicial_procedures_reform_bill:0 "Judicial Procedures Reform Bill"
  USA_judicial_procedures_reform_bill_desc:0 "Courts have long been our major roadblock when trying to pass New Deal legislation. By \"packing the courts\", we could get legislation through the judicial limbo."
  USA_reduce_judicial_procedures_reform_bill_tt:0 "Taking §YHenry Wallace§! as vice president will reduce the time this focus takes down to §G35§! days."
  USA_judicial_reform_focus_time_warning_tt:0 "With some political maneuvering, it is possible to reduce this focus down to §G35§! days.\n§RBut it can backfire and make recovery focuses require 245 days before the next one can be done.§!"
  USA_judicial_reform_bill_garner_tldr_tt:0 "§YWith §RJohn Garner§! as VP:§! Garner will be removed either way.\n • Concede on the bill: §Rmedium§! Congress opposition, §Y245-day§! cooldown on §Yall§! Great Depression recovery focuses.\n • Negotiate (§R-100 PP§!): §Rmedium§! Congress opposition, §Y210-day§! cooldown on §Yall§! Great Depression recovery focuses.\n\nTaking §YHenry Wallace§! as vice president will reduce the time this focus takes down to §G35§! days.\n • Make concessions: §Gsmall§! Congress opposition, §Y210-day§! cooldown on §Yall§! Great Depression recovery focuses.\n • Push the bill through (§R-50 PP§!): §Rmedium§! Congress opposition, but §G-35 days§! on the Fair Labor Standards Act, Agricultural Adjustment Act, and Federal Housing Act."
  USA_find_a_compromise:0 "Find a Compromise"
  USA_find_a_compromise_desc:0 "With major provisions of the Social Security Act still stuck in conservative courts, we should reach across the political aisle to find a compromise."
  USA_find_a_compromise_level_down_tt:0 "Reduces the §YGreat Depression§! level by one step."
  USA_find_a_compromise_reduced_opposition_tt:0 "Having found a compromise with conservatives, the §YFair Labor Standards Act§!, §YAgricultural Adjustment Act§!, and §YFederal Housing Act§! will each cost only §Gsmall§! Congress opposition instead of medium."
  USA_fdr_again:0 "New Deal Once More"
  USA_fdr_again_desc:0 "Only Franklin D. Roosevelt can lead us through the war."
  USA_interamerican_affair:0 "Office of Inter-American Affairs"
  USA_interamerican_affair_desc:0 "We must set up the office of inter-American affairs."
  USA_income_tax_increase:0 "Revenue Act of 1942"
  USA_income_tax_increase_desc:0 "We must increase taxes to support the war effort."
  USA_wilkies_deal:0 "Wilkie's New Deal"
  USA_wilkies_deal_desc:0 "Only Wilkie's new deal can lead us through the war."
  USA_free_trade_champion:0 "A Free Trade Champion"
  USA_free_trade_champion_desc:0 "We must have free trade."
  USA_midwest_development:0 "Midwest Rejuvenation Programme"
  USA_midwest_development_desc:0 "We must industrialize the midwest."
  USA_all_in:0 "All-In"
  USA_all_in_desc:0 "We must go All-In to win the war."
  USA_mobilise_the_nation:0 "Mobilise the Nation"
  USA_mobilise_the_nation_desc:0 "We must fully mobilise to support the war effort."
  USA_american_caesar:0 "An American Caesar"
  USA_american_caesar_desc:0 "An american caesar can lead us to victory!"
  USA_final_table:0 "The Final Table"
  USA_final_table_desc:0 "We must produce enough for the war effort."
  USA_rally_the_people:0 "Rally the People"
  USA_rally_the_people_desc:0 "The people need to support the war."
  USA_one_last_push:0 "One Final Push"
  USA_one_last_push_desc:0 "We need one final push to win the war."
  USA_third_man_walking:0 "Third Man Walking"
  USA_third_man_walking_desc:0 "We must build our economy to great strength."
  USA_economic_recovery:0 "Begin Economic Recovery"
  USA_economic_recovery_desc:0 "We must recover our economy."
  USA_anti_communism:0 "Crusade Against Communism"
  USA_anti_communism_desc:0 "Communism needs to be purged from this world!"
  USA_four_freedoms:0 "Four Freedoms"
  USA_four_freedoms_desc:0 "We have our Four freedoms. Freedom of Speech, Freedom of Religion, Freedom from Want, Freedom from Fear."
  USA_casablanca_conference:0 "The Casablanca Conference"
  USA_casablanca_conference_desc:0 "We need to coordinate strategies against the Axis powers."
  USA_germany_first:0 "Germany First"
  USA_germany_first_desc:0 "We must focus on taking out Germany first."
  USA_japan_first:0 "Japan First"
  USA_japan_first_desc:0 "We must focus on taking out Japan first."
  USA_war_department:0 "Begin Rearmament"
  USA_united_states_army_air_forces:0 "United States Army Air Forces"
  USA_united_states_army_air_forces_desc:0 "The United States Army Air Forces was created to merge the GHQ Air Force and the United States Army Air Corps, resolving long-standing problems of unity of command and giving American air power a clearer structure."
  USA_united_states_army_air_forces_dynamic_modifier:0 "United States Army Air Forces"
  USA_united_states_army_air_forces_dynamic_modifier_desc:0 "The United States Army Air Forces was created to merge the GHQ Air Force and the United States Army Air Corps, resolving long-standing problems of unity of command and giving American air power a clearer structure."
  USA_add_united_states_army_air_forces_modifier_tt:0 "Add §Y$USA_united_states_army_air_forces_dynamic_modifier$§!, which grants:"
  USA_modify_united_states_army_air_forces_modifier_tt:0 "Modify §Y$USA_united_states_army_air_forces_dynamic_modifier$§! by:"
  USA_repurpose_air_corps:0 "Repurpose Air Corps"
  USA_repurpose_air_corps_desc:0 "After the organizational shift, the Air Corps can be repurposed for the training and logistics needs of the United States Army Air Forces, giving the new command structure the practical backbone it needs."
  USA_air_innovations:0 "Air Innovations"
  USA_air_innovations_desc:0 "The rapid development of modern air warfare demands constant experimentation. By encouraging new ideas in doctrine, coordination, and aircraft employment, the United States Army Air Forces can stay ahead of its rivals."
  USA_prioritize_pilot_survivability:0 "Prioritize Pilot Survivability"
  USA_prioritize_pilot_survivability_desc:0 "Fighters can be made sturdier and more forgiving, even if the added protection comes at the cost of some agility. A pilot who returns home can learn, adapt, and fly again."
  USA_more_maneuverability:0 "More Maneuverability"
  USA_more_maneuverability_desc:0 "Speed and agility decide dogfights before armor plating can matter. By stripping weight and refining control surfaces, our fighters can outmaneuver their opponents at the cost of survivability."
  USA_lessons_from_battles:0 "Lessons from Battles"
  USA_lessons_from_battles_desc:0 "War gives harsh but invaluable lessons. By studying reports from active air battles and adapting our training, doctrine, and aircraft employment, the United States Army Air Forces can turn battlefield experience into lasting institutional knowledge."
  USA_upgraded_engines:0 "Upgraded Engines"
  USA_upgraded_engines_desc:0 "New engine designs and improved superchargers can give our aircraft the speed needed to dictate engagements and survive in increasingly demanding air battles."
  USA_air_to_air_radar:0 "Air To Air Radar"
  USA_air_to_air_radar_desc:0 "Radar sets are no longer only tools for ground stations and early warning networks. By adapting radar for air-to-air detection, our pilots can find enemy aircraft in poor visibility and at night with far greater confidence."
  USA_defeat_the_zero:0 "Defeat the Zero"
  USA_defeat_the_zero_desc:0 "Now that we are at war with Japan, our pilots must learn how to counter the agility and reach of the Zero. By studying its weaknesses and adapting our tactics, the United States Army Air Forces can blunt one of Japan's greatest advantages."
  USA_naval_bomber_tactics:0 "Naval Bomber Tactics"
  USA_naval_bomber_tactics_desc:0 "The Navy and Army Air Forces must refine low-altitude approaches, torpedo runs, and target identification if our naval bombers are to reliably threaten enemy fleets."
  USA_great_lake_carriers:0 "Great Lake Carriers"
  USA_great_lake_carriers_desc:0 "Training carriers on the Great Lakes can prepare pilots for carrier operations away from enemy attack, turning wartime urgency into safer and more efficient deck operations."
  USA_advanced_shipbuilding:0 "Advanced Shipbuilding"
  USA_advanced_shipbuilding_desc:0 "The next generation of capital ships will demand larger slips, tighter industrial coordination, and a willingness to commit resources before the war at sea is decided. With the proper hull designs ready, we can lay down a new class of ships at once."
  USA_award_fighter_contract:0 "Award Fighter Contract"
  USA_award_fighter_contract_desc:0 "America's aircraft manufacturers are ready to compete for the next generation of fighter production. By awarding a formal contract, we can accelerate fighter development and strengthen the selected company."
  USA_award_escort_fighter_contract:0 "Award Escort Fighter Contract"
  USA_award_escort_fighter_contract_desc:0 "Long-range escort fighters will be essential if our bombers are to operate safely over distant targets. We should award a dedicated contract to the manufacturer best suited for the task."
  USA_air_contract_limit_tt:0 "Fewer than §Y3§! air contracts or funding programs have been awarded."
  USA_award_cas_contract:0 "Award CAS Contract"
  USA_award_cas_contract_desc:0 "Close air support aircraft must be rugged, responsive, and able to bring heavy firepower directly to the battlefield. We should select a manufacturer to lead this effort."
  USA_award_tactical_bomber_contract:0 "Award Tactical Bomber Contract"
  USA_award_tactical_bomber_contract_desc:0 "Tactical bombers give the Air Corps the flexibility to strike enemy formations, infrastructure, and supply lines. A dedicated contract will accelerate development."
  USA_award_naval_aircraft_contract:0 "Award Naval Aircraft Contract"
  USA_award_naval_aircraft_contract_desc:0 "Control of the seas increasingly depends on aircraft able to scout, strike ships, and operate alongside the fleet. We should award a naval aircraft contract to a capable manufacturer."
  USA_strategic_bomber_funding:0 "Strategic Bomber Funding"
  USA_strategic_bomber_funding_desc:0 "Strategic bombers promise the range and payload needed to strike distant industrial targets. Dedicated funding for Boeing will help push these ambitious designs forward."
  USA_public_projects:0 "Public Projects"
  USA_investigate_uranium:0 "Advisory Committee on Uranium"
  USA_curtiss_organization:0 "Curtiss-Wright"
  USA_republic_aviations_organization:0 "Republic Aviations"
  USA_mio_trait_fighter_contract:0 "Fighter Contract"
  USA_mio_trait_fighter_contract_desc:0 "Federal contract funding has allowed this manufacturer to streamline production for fighter aircraft."
  USA_mio_trait_escort_fighter_contract:0 "Escort Fighter Contract"
  USA_mio_trait_escort_fighter_contract_desc:0 "Federal contract funding has allowed this manufacturer to streamline production for heavy escort fighters."
  USA_mio_trait_cas_contract:0 "Close Air Support Contract"
  USA_mio_trait_cas_contract_desc:0 "Federal contract funding has allowed this manufacturer to streamline production for close air support aircraft."
  USA_mio_trait_tactical_bomber_contract:0 "Tactical Bomber Contract"
  USA_mio_trait_tactical_bomber_contract_desc:0 "Federal contract funding has allowed this manufacturer to streamline production for tactical bombers."
  USA_mio_trait_naval_aircraft_contract:0 "Naval Aircraft Contract"
  USA_mio_trait_naval_aircraft_contract_desc:0 "Federal contract funding has allowed this manufacturer to streamline production for naval aircraft."
  USA_mio_trait_strategic_bomber_contract:0 "Strategic Bomber Contract"
  USA_mio_trait_strategic_bomber_contract_desc:0 "Federal strategic bomber funding has allowed Boeing to streamline production for strategic bombers."
  USA_mio_trait_deck_airplane_storage:0 "Deck Airplane Storage"
  USA_mio_trait_deck_airplane_storage_desc:0 "By refining deck parking procedures and aircraft handling, carriers built by this yard can carry additional aircraft without a full redesign."
  USA_mio_trait_bazooka:0 "Bazooka"
  USA_m1_garand:0 "M1 Garand"
  USA_m1_garand_desc:0 "The M1 Garand was the first standard issue semi-auto rifle, entering production in early 1936. Patton himself called it 'the greatest battle implement ever devised.'\nProduction difficulties have now been ironed out, and Springfield Armory is ready to start delivering M1 Garands to the U.S. Army in larger numbers."
  USA_mio_trait_m1_garand_self_loading_rifle:0 "M1 Garand Self Loading Rifle"
  USA_support_weapon_development:0 "Support Weapon Development"
  USA_support_weapon_development_desc:0 "Garand is a great infantry weapon, but we need to equip the rest of the infantry squad with equally impressive firepower."
  USA_worlds_best_fed_army:0 "The World's Best-Fed Army"
  USA_worlds_best_fed_army_desc:0 "The U.S. Army has developed a range of ration systems, from A and B rations for prepared meals to C, D, and K rations for field conditions. Standardizing their production and distribution will help ensure American troops stay fed wherever they are deployed."
  USA_k_rations:0 "K-Rations"
  USA_k_rations_desc:0 "Compact, standardized rations allow soldiers to remain supplied and operational even when regular kitchens and supply lines cannot keep pace."

