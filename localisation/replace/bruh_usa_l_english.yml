  USA_cash_and_carry_program_idea_desc:0 "American firms are profiting from foreign purchases of equipment and supplies, giving domestic construction a modest boost."
  USA_revitilizing_military_industry_idea:0 "Revitilizing Military Industry"
  USA_revitilizing_military_industry_idea_desc:0 "New wartime demand is drawing investment into arms production and expanding the military industrial base."
  USA_foreign_air_volunteers_flying_tigers:0 "Foreign Air Volunteers"
  USA_foreign_air_volunteers_flying_tigers_desc:0 "American pilots serving abroad are sending back practical lessons from modern air warfare, accelerating our mastery of air combat."
